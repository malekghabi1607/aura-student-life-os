server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
spring:
  application:
    name: finance-tracker-api
  profiles:
    default: prod
  mail:
    host: smtp.resend.com
    port: 465
    username: resend
    password: ${RESEND_API_KEY:}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
  datasource:
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL:10}
      minimum-idle: 1
      connection-timeout: 30000
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
  jackson:
    date-format: yyyy-MM-dd
    time-zone: UTC
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000
gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.0-flash}
  rate-limit:
    requests: ${AI_RATE_LIMIT_REQUESTS:10}
    window-seconds: ${AI_RATE_LIMIT_WINDOW_SECONDS:60}
logging:
  level:
    root: INFO
    "[com.financetracker]": INFO
    "[org.hibernate.SQL]": "OFF"
    "[org.hibernate.orm.jdbc.bind]": "OFF"
