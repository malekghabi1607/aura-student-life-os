server:
  port: 8080

spring:
  application:
    name: finance-tracker-api

  mail:
    host: smtp.resend.com
    port: 465
    username: resend
    password: ${RESEND_API_KEY:changeme}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/finance_tracker}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL:10}
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        "[format_sql]": false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  jackson:
    date-format: yyyy-MM-dd
    time-zone: UTC

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha

app:
  frontend-url: http://localhost:5173
  backend-url: http://localhost:8080
  mail:
    from: onboarding@resend.dev

gemini:
  api-key: ${GEMINI_API_KEY:changeme}
  model: gemini-2.0-flash

jwt:
  secret: ${JWT_SECRET:change-this-development-secret-key-minimum-32-chars}
  expiration: 86400000

logging:
  level:
    "[com.financetracker]": DEBUG
    "[org.hibernate.SQL]": DEBUG
    "[org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer]": ERROR
