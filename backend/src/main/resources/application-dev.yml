spring:
  config:
    import: "optional:file:./.env[.properties]"
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/finance_tracker}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
  # Development databases are usually created by ddl-auto=update and have no Flyway
  # history, so Flyway would refuse them. Opt in with FLYWAY_ENABLED=true on a dedicated DB.
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  backend-url: ${APP_BACKEND_URL:http://localhost:8080}
  mail:
    from: ${APP_MAIL_FROM:onboarding@resend.dev}
